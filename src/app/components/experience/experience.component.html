<div class="container d-flex flex-column align-items-center justify-content-center experience-bg" #skillsSection>
  <div class="col-12 text-center mb-4">
    <h2 style="font-weight: bold; color: #fff;">Experiencia</h2>
  </div>
  <div class="section-card mb-4 d-flex flex-row align-items-stretch">
    <div class="section-icon-box app-bg d-flex flex-column align-items-center justify-content-center">
      <img src="https://img.icons8.com/ios-filled/100/ffffff/smartphone-tablet.png" alt="App Development" class="section-icon">
      <span class="section-title">Desarrollo de aplicaciones</span>
    </div>
    <div class="section-skills d-flex flex-row align-items-center justify-content-center flex-grow-1">
      <div *ngFor="let skill of appSkills; let i = index" class="skill-circle text-center">
        <svg width="110" height="110">
          <circle cx="55" cy="55" r="48" stroke="#e0e0e0" stroke-width="10" fill="none" />
          <circle cx="55" cy="55" r="48" [attr.stroke]="skill.color" stroke-width="10" fill="none"
            [attr.stroke-dasharray]="2 * 3.1416 * 48"
            [attr.stroke-dashoffset]="2 * 3.1416 * 48 * (1 - animatedAppPercents[i] / 100)"
            stroke-linecap="round"
            style="transition: stroke-dashoffset 0.45s cubic-bezier(0.77,0,0.18,1);"/>
        </svg>
        <div class="icon-progress">
          <img [src]="getIconUrl(skill.name, skill.color)" class="icon-bg" [ngClass]="{'icon-java': skill.name === 'Java'}" [style.opacity]="0.18">
          <div class="icon-fill" [ngStyle]="{ height: animatedAppPercents[i] + '%'}">
            <img [src]="getIconUrl(skill.name, skill.color)" class="icon-fg" [ngClass]="{'icon-java': skill.name === 'Java'}">
          </div>
          <span class="percent-text">{{animatedAppPercents[i]}}%</span>
        </div>
        <div class="mt-2 skill-label">{{skill.name}}</div>
      </div>
    </div>
  </div>
  <div class="section-card mb-4 d-flex flex-row align-items-stretch">
    <div class="section-icon-box web-bg d-flex flex-column align-items-center justify-content-center">
      <img src="https://img.icons8.com/ios-filled/100/ffffff/internet--v1.png" alt="Web Development" class="section-icon">
      <span class="section-title">Desarrollo web</span>
    </div>
    <div class="section-skills d-flex flex-row align-items-center justify-content-center flex-grow-1">
      <div *ngFor="let skill of webSkills; let i = index" class="skill-circle text-center">
        <svg width="110" height="110">
          <circle cx="55" cy="55" r="48" stroke="#e0e0e0" stroke-width="10" fill="none" />
          <circle cx="55" cy="55" r="48" [attr.stroke]="skill.color" stroke-width="10" fill="none"
            [attr.stroke-dasharray]="2 * 3.1416 * 48"
            [attr.stroke-dashoffset]="2 * 3.1416 * 48 * (1 - animatedWebPercents[i] / 100)"
            stroke-linecap="round"
            style="transition: stroke-dashoffset 0.45s cubic-bezier(0.77,0,0.18,1);"/>
        </svg>
        <div class="icon-progress">
          <img [src]="getIconUrl(skill.name, skill.color)" class="icon-bg" [ngClass]="{'icon-java': skill.name === 'Java'}" [style.opacity]="0.18">
          <div class="icon-fill" [ngStyle]="{ height: animatedWebPercents[i] + '%'}">
            <img [src]="getIconUrl(skill.name, skill.color)" class="icon-fg" [ngClass]="{'icon-java': skill.name === 'Java'}">
          </div>
          <span class="percent-text">{{animatedWebPercents[i]}}%</span>
        </div>
        <div class="mt-2 skill-label">{{skill.name}}</div>
      </div>
    </div>
  </div>
